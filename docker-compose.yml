services:
  labelstudio:
    image: heartexlabs/label-studio:latest
    ports:
      - "${LABEL_STUDIO_PORT:-8181}:8080"
    volumes:
      - ls_data:/label-studio/data
      - ./outputs:/data:ro
      - ./scripts/ls_entrypoint.sh:/entrypoint.sh:ro
    environment:
      LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /data
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-you@example.com}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-changeme}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_USER_TOKEN:-dda-bootstrap-token-change-in-env}
      LABEL_STUDIO_LEGACY_API_TOKEN_ENABLED: "true"
      LEGACY_API_TOKEN_ENABLED: "true"
      DATA_ROOT: /data
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

volumes:
  ls_data:
